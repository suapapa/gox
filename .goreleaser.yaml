# This is an example .goreleaser.yml file with some sensible defaults.
# Make sure to check the documentation at https://goreleaser.com

# The lines below are called `modelines`. See `:help modeline`
# Feel free to remove those if you don't want/need to use them.
# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj

version: 2

before:
  hooks:
    # You may remove this if you don't use go modules.
    - go mod tidy
    # you may remove this if you don't need go generate
    # - go generate ./...

builds:
  - id: gox
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
  - id: gox-darwin
    binary: gox
    env:
      - CGO_ENABLED=0
    goos:
      - darwin

archives:
  - id: gox
    ids:
      - gox
      - gox-darwin
    formats: [tar.gz]
    # this name template makes the OS and Arch compatible with the results of `uname`.
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    # use zip for windows and macOS archives (notarytool prefers zip)
    format_overrides:
      - goos: windows
        formats: [zip]
      - goos: darwin
        formats: [zip]

binary_signs:
  - id: macos-signing
    cmd: codesign
    args:
      - "--sign"
      - "{{ .Env.MACOS_SIGN_IDENTITY }}"
      - "--force"
      - "--options"
      - "runtime"
      - "--timestamp"
      - "{{ .Path }}"
    artifacts: binary
    ids:
      - gox-darwin

publishers:
  - name: macos-notarize
    ids: [ gox ]
    cmd: |
      bash -c 'if [[ "{{ .ArtifactPath }}" == *.zip ]] && [[ "{{ .Os }}" == "darwin" ]]; then \
        xcrun notarytool submit "{{ .ArtifactPath }}" \
          --issuer "{{ .Env.MACOS_NOTARY_ISSUER_ID }}" \
          --key-id "{{ .Env.MACOS_NOTARY_KEY_ID }}" \
          --key "/tmp/notary.p8" \
          --wait; \
      fi'

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

homebrew_casks:
  - repository:
      owner: suapapa
      name: homebrew-tools
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    name: gox
    homepage: "https://github.com/suapapa/gox"
    description: "Go version of npx - Execute Go binaries directly from source"
    commit_msg_template: "Brew cask update for {{ .ProjectName }} version {{ .Tag }}"

release:
  footer: >-

    ---

    Released by [GoReleaser](https://github.com/goreleaser/goreleaser).
